name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main # Workflow berjalan otomatis saat Anda push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Menggunakan Node.js versi 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Next.js Project
        run: npm run build

      - name: 🗜️ Create ZIP Archive
        run: |
          echo "Membuat folder penampung ZIP..."
          mkdir -p ./deploy-folder
          
          echo "Mengompres .next, node_modules, public, dan konfigurasi menjadi 1 file ZIP..."
          # Command zip ini hanya membungkus file yang dibutuhkan server cPanel
          zip -r ./deploy-folder/build-ramahaxor.zip .next node_modules public package.json next.config.mjs

      - name: 🚀 Upload ZIP to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-folder/
          server-dir: /ramahaxor.my.id/
